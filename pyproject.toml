[project]
name = "werkwinkeldatabank-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.44.3",
    "django>=5.2,<6.0",
    "django-cors-headers>=4.9.0",
    "dj-email-url>=1.0.1",
    "django-debug-toolbar>=8.0.0",
    "django-extensions>=3.2.3",
    "django-filter>=26.2",
    "django-sql-middleware>=0.0.7",
    "django-storages>=1.14.6",
    "djangorestframework>=3.14",
    "drf-yasg>=1.21.4",
    "environs>=8.0.0",
    "gunicorn>=26,<27",
    "marshmallow>=4.3.1,<5",
    "mozilla-django-oidc>=4.0.0",
    "packaging>=23.2",
    "psycopg2-binary>=2.9.13",
    "pypdf>=6.21.4,<7",
    "pyyaml>=6.0.3",
    "requests>=2.24.0",
    "urllib3>=1.26.18",
    "xhtml2pdf>=0.2.28",
]

[dependency-groups]
# tools voor ontwikkeling en CI; Ansible installeert met --no-dev
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.5.2",
    "pytest-cov>=3.0",
    "coverage[toml]>=6.2",
    "black>=24.4.2",
    "isort>=9.0.2",
    "ruff>=0.17.5",
    "pylint>=4.0.9",
    "pylint-django>=2.8.0",
]

[tool.uv]
# applicatie, geen pakket: uv bouwt of installeert het project zelf niet
package = false


[tool.black]
line-length = 119
target-version = ['py311']



[tool.coverage.html]
directory = "var/coverage/html"

[tool.coverage.xml]
output = "var/coverage/coverage.xml"

[tool.coverage.report]
# cfr. https://coverage.readthedocs.io/en/coverage-4.2/excluding.html
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
# fail_under = 100
include = ["src/*"]
omit = ["manage.py", "*/migrations/*"]
# show_missing = true

[tool.coverage.run]
branch = true
data_file = "var/coverage/coverage.db"
source = ["apps", "scouts_wwdb_api"]
omit = ["manage.py", "*/migrations/*"]


[tool.isort]
include_trailing_comma = true # corresponds to -tc flag
known_third_party = []
line_length = 120             # corresponds to -w  flag
multi_line_output = 3         # corresponds to -m  flag
skip_glob = '^((?!py$).)*$'   # isort all Python files
# profile = "black"
# force_single_line = true
# lines_after_imports = 2

[tool.pylint.format]
max-line-length = 120
good-names = [
    # "foo", # dummy variable
    # "i",   # counter in loop
    # "ok",  # status
]

[tool.pylint.linters]
max-line-length = 120
good-names = [
    # "foo", # dummy variable
    # "i",   # counter in loop
    # "ok",  # status
]
ignored-modules = []
ignore-paths=[
    "src/.*/migrations/",
]

[tool.pylint.messages_control]
disable = [
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    # "E1101",  # no-member
    "R0903",  # too-few-public-methods
    "W0223",  # abstract-method
    "W1203",  # logging-fstring-interpolation
]

[tool.pylint.typecheck]
# REQUEST,acl_users,aq_parent,"[a-zA-Z]+_set{1,2}",save,delete
generated-members= [
    "save",
    "objects",  # Class 'CKEditorFile' has no 'objects' member (no-member)
    "ObjectDoesNotExist",
]


[tool.pytest.ini_options]
cache_dir = "var/cache/pytest"
log_cli = false                   # enable to show log-output
log_cli_level = "NOTSET"
filterwarnings = []
markers = ["unit", "integration"]
# pythonpath = [".", "scouts_wwdb_api"]
testpaths = ["tests"]
# the junit-report is used to report coverage in gitlab
addopts = "--color=yes --junit-xml='${BASE_DIR}/var/coverage/pytest.xml'"
django_debug_mode = "keep"
DJANGO_SETTINGS_MODULE = "scouts_wwdb_api.settings"


[tool.ruff]
# ruff searches for settings in the target-dir and up
# https://docs.astral.sh/ruff/configuration
cache-dir = "var/cache/ruff"
exclude = ["**/migrations/*.py"]
line-length = 120

[tool.ruff.format]
preview = true
